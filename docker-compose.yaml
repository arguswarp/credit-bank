version: '3.0'

services:
  calculator:
    container_name: calc-service
    build:
      context: calculator/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - bank-net
  deal:
    container_name: deal-service
    env_file:
      - ./deal/.env
    build:
      context: deal/
      dockerfile: Dockerfile
#    environment:
#      - DB_URL= $DB_URL
#      - DB_USERNAME= $DB_USERNAME
#      - DB_PASSWORD= $DB_PASSWORD
    ports:
      - "8081:8081"
    depends_on:
      - db
    networks:
      - bank-net
      - kafka-net
  statement:
    container_name: statement-service
    env_file:
      - ./statement/.env
    build:
      context: statement/
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    networks:
      - bank-net
  db:
    image: postgres:16
    container_name: bank-db
    env_file:
      - deal/.env
#    environment:
#      - POSTGRES_USER=$DB_USERNAME
#      - POSTGRES_PASSWORD=$DB_PASSWORD
#      - POSTGRES_DB=$DB_NAME
    ports:
      - "5432:5432"
    networks:
      - bank-net
    volumes:
      - bank_data:/var/lib/postgresql/data
  zookeeper:
    image: wurstmeister/zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-net

  kafka:
    image: wurstmeister/kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "finish-registration:1:1, create-documents:1:1, send-documents:1:1, send-ses:1:1, credit-issued:1:1, statement-denied:1:1"
    networks:
      - kafka-net
volumes:
  bank_data:
networks:
  bank-net:
  kafka-net: